<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px dashed #dee2e6;
            text-align: center;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }

        .upload-section.dragover {
            border-color: #667eea;
            background: #e8f0fe;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .user-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 1em;
            margin-top: 20px;
            resize: vertical;
            min-height: 100px;
        }

        .user-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* LangGraph流程展示样式 */
        .langgraph-flow {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            border: 1px solid #e9ecef;
        }

        .flow-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-weight: bold;
        }

        .flow-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .flow-step {
            flex: 1;
            min-width: 150px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            position: relative;
        }

        .flow-step.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.05);
        }

        .flow-step.completed {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .flow-step.failed {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .step-icon {
            font-size: 2em;
            margin-bottom: 10px;
            display: block;
        }

        .step-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .step-description {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .flow-arrow {
            font-size: 1.5em;
            color: #667eea;
            margin: 0 10px;
        }

        /* 列识别可视化样式 */
        .column-analysis {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            border: 1px solid #e9ecef;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .analysis-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 25px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .column-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .column-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }

        .column-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .column-card.device-column {
            border-left-color: #28a745;
            background: #f0fff4;
        }

        .column-card.time-column {
            border-left-color: #ffc107;
            background: #fffbf0;
        }

        .column-card.business-column {
            border-left-color: #17a2b8;
            background: #f0f9ff;
        }

        .column-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .column-type {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .type-device {
            background: #d4edda;
            color: #155724;
        }

        .type-time {
            background: #fff3cd;
            color: #856404;
        }

        .type-business {
            background: #d1ecf1;
            color: #0c5460;
        }

        .column-description {
            color: #666;
            line-height: 1.5;
        }

        /* 业务含义展示样式 */
        .business-meaning {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            border: 1px solid #dee2e6;
        }

        .meaning-content {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .meaning-text {
            font-size: 1.1em;
            line-height: 1.8;
            color: #333;
            text-align: justify;
        }

        /* 控制原理展示样式 */
        .control-principle {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            border: 1px solid #90caf9;
        }

        .principle-content {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .principle-text {
            font-size: 1.1em;
            line-height: 1.8;
            color: #333;
            text-align: justify;
        }

        /* 数据整理结果表格样式 */
        .data-summary {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            border: 1px solid #e9ecef;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .summary-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
        }

        .summary-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .summary-label {
            color: #666;
            font-size: 0.9em;
        }

        /* 业务解读和质量评估样式 */
        .analysis-results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin: 30px 0;
        }

        .business-analysis, .quality-assessment {
            background: white;
            border-radius: 15px;
            padding: 30px;
            border: 1px solid #e9ecef;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .analysis-content {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }

        .quality-score {
            font-size: 1.1em;
            font-weight: bold;
            color: #28a745;
            padding: 4px 8px;
            border-radius: 12px;
            background: #d4edda;
            display: inline-block;
            min-width: 60px;
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(#28a745 0deg, #28a745 var(--score-deg), #e9ecef var(--score-deg), #e9ecef 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            position: relative;
        }

        .score-circle::before {
            content: '';
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            position: absolute;
        }

        .score-text {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            z-index: 1;
        }

        .datasets-section {
            margin-top: 40px;
        }

        .section-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .dataset-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 80px;
        }

        .dataset-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .dataset-main-info {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 30px;
        }

        .dataset-name-section {
            min-width: 180px;
            flex: 0 0 180px;
        }

        .dataset-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .dataset-upload-time {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
        }

        .dataset-status {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
            display: inline-block;
        }

        .dataset-stats {
            display: flex;
            gap: 20px;
            align-items: center;
            flex: 1;
        }

        .stat-item {
            text-align: center;
            min-width: 70px;
            flex: 0 0 70px;
        }

        .stat-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #667eea;
            display: block;
        }

        .stat-status {
            font-size: 0.9em;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
            min-width: 60px;
            text-align: center;
        }

        .status-completed-analysis {
            background: #d4edda;
            color: #155724;
        }

        .status-pending-analysis {
            background: #fff3cd;
            color: #856404;
        }

        .status-not-started {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-info:hover {
            background: #138496;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 0.8em;
            color: #666;
            margin-top: 2px;
        }

        .dataset-actions {
            display: flex;
            gap: 15px;
            flex-shrink: 0;
            align-items: center;
            min-width: 380px;
            flex: 0 0 380px;
        }

        .action-group {
            display: flex;
            gap: 6px;
        }

        .function-group {
            border-right: 2px solid #e9ecef;
            padding-right: 12px;
        }

        .manage-group {
            padding-left: 3px;
        }

        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
        }

        .loading-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            z-index: 10000;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
        }

        .message.show {
            opacity: 1;
            transform: translateX(0);
        }

        .message.success {
            background: #28a745;
        }

        .message.error {
            background: #dc3545;
        }

        .message.info {
            background: #17a2b8;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .main-content {
                padding: 20px;
            }

            .flow-steps {
                flex-direction: column;
            }

            .flow-arrow {
                transform: rotate(90deg);
                margin: 10px 0;
            }

            .analysis-results {
                grid-template-columns: 1fr;
            }

            .column-grid {
                grid-template-columns: 1fr;
            }

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 隐藏的详细分析面板 */
        .detailed-analysis {
            display: none;
            margin-top: 20px;
        }

        .detailed-analysis.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 标签样式调整 */
        .dataset-tags {
            margin: 8px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7em;
            margin: 0;
        }

        /* 描述信息样式 */
        .dataset-description {
            margin-top: 8px;
            font-size: 0.9em;
            color: #666;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 列表头部 */
        .datasets-header {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            color: #666;
        }

        .header-main-info {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 30px;
        }

        .header-name-section {
            min-width: 180px;
            flex: 0 0 180px;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            align-items: center;
            flex: 1;
        }

        .header-stat-item {
            text-align: center;
            min-width: 70px;
            font-size: 0.9em;
            flex: 0 0 70px;
        }

        .header-actions {
            min-width: 380px;
            text-align: center;
            flex: 0 0 380px;
        }

        /* 状态样式 */
        .status-uploaded {
            background: #fff3cd;
            color: #856404;
        }

        .status-extracting {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        /* 响应式调整 */
        @media (max-width: 1024px) {
            .dataset-card {
                flex-direction: column;
                align-items: flex-start;
                min-height: auto;
                padding: 20px;
            }
            
            .dataset-main-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                width: 100%;
            }

            .dataset-stats {
                justify-content: space-around;
                width: 100%;
            }
            
            .dataset-actions {
                margin-top: 15px;
                justify-content: center;
                width: 100%;
                flex-direction: column;
                gap: 15px;
            }

            .action-group {
                justify-content: center;
            }

            .function-group {
                border-right: none;
                border-bottom: 2px solid #e9ecef;
                padding-right: 0;
                padding-bottom: 10px;
            }

            .manage-group {
                padding-left: 0;
                padding-top: 5px;
            }

            .datasets-header {
                display: none;
            }
        }

        /* 翻页控件样式 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            gap: 10px;
        }

        .pagination-btn {
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            background: white;
            color: #667eea;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            min-width: 40px;
            text-align: center;
        }

        .pagination-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-1px);
        }

        .pagination-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .pagination-btn:disabled {
            background: #f8f9fa;
            color: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .pagination-info {
            margin: 0 15px;
            color: #666;
            font-size: 0.9em;
        }

        /* 每页显示数量选择器 */
        .page-size-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .page-size-select {
            padding: 5px 10px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 智能数据管理系统</h1>
            <p>基于LangGraph的智能数据分析与管理平台</p>
        </div>

        <div class="main-content">
            <!-- 文件上传区域 -->
            <div class="upload-section" id="uploadSection">
                <div class="upload-icon">📁</div>
                <h3>上传数据集</h3>
                <p>支持CSV文件或ZIP压缩包，拖拽文件到此处或点击选择</p>
                <input type="file" id="fileInput" class="file-input" accept=".csv,.zip">
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">选择文件</button>
                <textarea id="userInput" class="user-input" placeholder="请输入数据集的额外信息，例如：数据来源、业务背景、特殊说明等（可选）"></textarea>
            </div>

            <!-- LangGraph流程展示 -->
            <div class="langgraph-flow" id="langGraphFlow" style="display: none;">
                <div class="flow-title">🔄 LangGraph智能分析流程</div>
                <div class="flow-steps">
                    <div class="flow-step" id="step-upload">
                        <span class="step-icon">📤</span>
                        <div class="step-title">数据上传</div>
                        <div class="step-description">文件解析与验证</div>
                    </div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-step" id="step-structure">
                        <span class="step-icon">🔍</span>
                        <div class="step-title">结构分析</div>
                        <div class="step-description">数据结构识别</div>
                    </div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-step" id="step-columns">
                        <span class="step-icon">📊</span>
                        <div class="step-title">列识别</div>
                        <div class="step-description">设备列与时间列</div>
                    </div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-step" id="step-meaning">
                        <span class="step-icon">💡</span>
                        <div class="step-title">业务含义</div>
                        <div class="step-description">业务逻辑分析</div>
                    </div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-step" id="step-principle">
                        <span class="step-icon">⚙️</span>

                        <div class="step-description">控制逻辑推理</div>
                    </div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-step" id="step-quality">
                        <span class="step-icon">✅</span>
                        <div class="step-title">质量评估</div>
                        <div class="step-description">数据质量分析</div>
                    </div>
                </div>
            </div>

            <!-- 列识别可视化 -->
            <div class="column-analysis" id="columnAnalysis" style="display: none;">
                <div class="analysis-title">📊 列识别与分析结果</div>
                <div class="column-grid" id="columnGrid">
                    <!-- 动态生成列分析卡片 -->
                </div>
            </div>

            <!-- 业务含义展示 -->
            <div class="business-meaning" id="businessMeaning" style="display: none;">
                <div class="analysis-title">💡 业务含义分析</div>
                <div class="meaning-content">
                    <div class="meaning-text" id="meaningText">
                        <!-- 动态生成业务含义内容 -->
                    </div>
                </div>
            </div>

            <!-- 控制原理展示 -->
            <div class="control-principle" id="controlPrinciple" style="display: none;">
                <div class="analysis-title">⚙️ 控制原理分析</div>
                <div class="principle-content">
                    <div class="principle-text" id="principleText">
                        <!-- 动态生成控制原理内容 -->
                    </div>
                </div>
            </div>

            <!-- 数据整理结果 -->
            <div class="data-summary" id="dataSummary" style="display: none;">
                <div class="analysis-title">📋 数据整理结果</div>
                <div class="summary-grid" id="summaryGrid">
                    <!-- 动态生成数据摘要卡片 -->
                </div>
            </div>

            <!-- 业务解读和质量评估 -->
            <div class="analysis-results" id="analysisResults" style="display: none;">
                <div class="business-analysis">
                    <div class="analysis-title">📈 业务解读</div>
                    <div class="analysis-content" id="businessAnalysisContent">
                        <!-- 动态生成业务解读内容 -->
                    </div>
                </div>
                <div class="quality-assessment">
                    <div class="analysis-title">🎯 数据质量评估</div>
                    <div class="quality-score">
                        <div class="score-circle" id="scoreCircle">
                            <div class="score-text" id="scoreText">--</div>
                        </div>
                        <div>数据质量评分</div>
                    </div>
                    <div class="analysis-content" id="qualityAnalysisContent">
                        <!-- 动态生成质量评估内容 -->
                    </div>
                </div>
            </div>

            <!-- 数据集列表 -->
            <div class="datasets-section">
                <h2 class="section-title">📚 数据集管理</h2>
                
                <!-- 每页显示数量选择器 -->
                <div class="page-size-selector">
                    <span>每页显示：</span>
                    <select id="pageSizeSelect" class="page-size-select" onchange="changePageSize()">
                        <option value="5">5条</option>
                        <option value="10" selected>10条</option>
                        <option value="20">20条</option>
                        <option value="50">50条</option>
                    </select>
                </div>
                
                <div id="datasetsList">
                    <!-- 动态生成数据集列表 -->
                </div>
                
                <!-- 翻页控件 -->
                <div class="pagination" id="pagination" style="display: none;">
                    <button class="pagination-btn" id="prevBtn" onclick="changePage('prev')" disabled>上一页</button>
                    <div id="pageNumbers"></div>
                    <button class="pagination-btn" id="nextBtn" onclick="changePage('next')">下一页</button>
                    <div class="pagination-info" id="paginationInfo"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载动画 -->
    <div class="loading" id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <div>正在处理，请稍候...</div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div class="message" id="message"></div>

    <script>
        const API_BASE = '/api/v1';
        let currentDatasetId = null;
        
        // 分页相关变量
        let currentPage = 1;
        let pageSize = 10;
        let totalDatasets = 0;
        let allDatasets = [];

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadDatasets();
            setupEventListeners();
        });

        // 设置事件监听器
        function setupEventListeners() {
            const uploadSection = document.getElementById('uploadSection');
            const fileInput = document.getElementById('fileInput');

            // 拖拽上传
            uploadSection.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadSection.classList.add('dragover');
            });

            uploadSection.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadSection.classList.remove('dragover');
            });

            uploadSection.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadSection.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFileUpload(files[0]);
                }
            });

            // 文件选择
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    handleFileUpload(e.target.files[0]);
                }
            });
        }

        // 处理文件上传
        async function handleFileUpload(file) {
            // 显示LangGraph流程
            showLangGraphFlow();
            
            // 重置所有步骤状态
            resetFlowSteps();
            
            // 开始上传流程
            await uploadFile(file);
        }

        // 显示LangGraph流程
        function showLangGraphFlow() {
            document.getElementById('langGraphFlow').style.display = 'block';
        }

        // 重置流程步骤状态
        function resetFlowSteps() {
            const steps = ['upload', 'structure', 'columns', 'meaning', 'principle', 'quality'];
            steps.forEach(step => {
                const element = document.getElementById(`step-${step}`);
                element.className = 'flow-step';
            });
        }

        // 更新流程步骤状态
        function updateFlowStep(stepName, status) {
            const element = document.getElementById(`step-${stepName}`);
            element.className = `flow-step ${status}`;
        }

        // 显示加载动画
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // 显示消息
        function showMessage(text, type = 'info') {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type}`;
            message.classList.add('show');

            setTimeout(() => {
                message.classList.remove('show');
            }, 3000);
        }

        // 上传文件
        async function uploadFile(file) {
            const userInput = document.getElementById('userInput').value;
            
            // 验证文件类型
            const allowedTypes = ['.csv', '.zip'];
            const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
            
            if (!allowedTypes.includes(fileExtension)) {
                showMessage('请上传CSV文件或ZIP压缩包', 'error');
                return;
            }

            // 更新上传步骤状态
            updateFlowStep('upload', 'active');
            showLoading(true);
            
            const formData = new FormData();
            formData.append('file', file);
            if (userInput) {
                formData.append('user_input', userInput);
            }

            try {
                const response = await fetch(`${API_BASE}/datasets/upload`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    updateFlowStep('upload', 'completed');
                    currentDatasetId = result.dataset_id;
                    showMessage(`文件上传成功！数据集ID: ${result.dataset_id}`, 'success');
                    
                    // 清空输入
                    document.getElementById('fileInput').value = '';
                    document.getElementById('userInput').value = '';
                    
                    // 开始自动分析流程
                    await startAnalysisFlow(result.dataset_id);
                    
                } else {
                    updateFlowStep('upload', 'failed');
                    showMessage(`上传失败: ${result.detail}`, 'error');
                }
            } catch (error) {
                updateFlowStep('upload', 'failed');
                showMessage(`上传失败: ${error.message}`, 'error');
            } finally {
                showLoading(false);
            }
        }

        // 开始分析流程（模拟LangGraph自动流程）
        async function startAnalysisFlow(datasetId) {
            try {
                // 模拟各个分析步骤
                await simulateAnalysisStep('structure', '正在分析数据结构...', 2000);
                await simulateAnalysisStep('columns', '正在识别设备列和时间列...', 3000);
                await simulateAnalysisStep('meaning', '正在分析业务含义...', 2500);
                await simulateAnalysisStep('principle', '正在推理控制原理...', 3500);
                await simulateAnalysisStep('quality', '正在评估数据质量...', 2000);
                
                // 显示分析结果
                await showAnalysisResults(datasetId);
                
                // 刷新数据集列表
                setTimeout(() => {
                    loadDatasets();
                }, 1000);
                
            } catch (error) {
                showMessage(`分析失败: ${error.message}`, 'error');
            }
        }

        // 模拟分析步骤
        async function simulateAnalysisStep(stepName, message, duration) {
            updateFlowStep(stepName, 'active');
            showMessage(message, 'info');
            
            await new Promise(resolve => setTimeout(resolve, duration));
            
            updateFlowStep(stepName, 'completed');
        }

        // 显示分析结果
        async function showAnalysisResults(datasetId) {
            // 模拟获取分析结果数据
            const mockResults = generateMockAnalysisResults();
            
            // 显示列识别结果
            showColumnAnalysis(mockResults.columns);
            
            // 显示业务含义
            showBusinessMeaning(mockResults.businessMeaning);
            
            // 显示控制原理
            showControlPrinciple(mockResults.controlPrinciple);
            
            // 显示数据摘要
            showDataSummary(mockResults.summary);
            
            // 显示业务解读和质量评估
            showAnalysisResults(mockResults.businessAnalysis, mockResults.qualityAssessment);
        }

        // 生成模拟分析结果
        function generateMockAnalysisResults() {
            return {
                columns: [
                    {
                        name: 'device_id',
                        type: 'device',
                        description: '设备唯一标识符，用于区分不同的监控设备'
                    },
                    {
                        name: 'timestamp',
                        type: 'time',
                        description: '数据采集时间戳，记录每次数据采集的具体时间'
                    },
                    {
                        name: 'temperature',
                        type: 'business',
                        description: '设备温度传感器读数，反映设备运行时的温度状态'
                    },
                    {
                        name: 'pressure',
                        type: 'business',
                        description: '压力传感器数值，监控系统压力变化'
                    },
                    {
                        name: 'flow_rate',
                        type: 'business',
                        description: '流量计读数，测量流体通过管道的速率'
                    }
                ],
                businessMeaning: '该数据集包含工业设备的实时监控数据，主要用于监测生产线上关键设备的运行状态。通过温度、压力、流量等关键指标的持续监控，可以及时发现设备异常，预防生产事故，确保生产过程的稳定性和安全性。数据采集频率较高，适合用于实时监控和预测性维护分析。',
                controlPrinciple: '该系统采用分布式传感器网络进行数据采集，每个设备配备多个传感器同时监测不同参数。控制逻辑基于阈值监控和趋势分析，当任一参数超出预设范围时触发报警。系统还具备自适应调节功能，根据历史数据和当前状态自动调整控制参数，实现设备的智能化运行管理。',
                summary: {
                    totalRows: 15420,
                    totalColumns: 5,
                    fileSize: '2.3 MB',
                    timeRange: '2024-01-01 至 2024-01-31',
                    deviceCount: 12,
                    dataQuality: 92
                },
                businessAnalysis: '数据显示设备运行状态良好，各项指标均在正常范围内。温度变化趋势稳定，压力波动较小，流量保持在设计范围内。建议继续保持当前的维护策略，并关注设备ID为DEV-003的温度异常波动。',
                qualityAssessment: {
                    score: 92,
                    details: '数据完整性良好，缺失值比例低于2%。时间序列连续性强，采样频率稳定。发现少量异常值，建议进一步清洗。整体数据质量满足分析要求。'
                }
            };
        }

        // 显示列识别分析
        function showColumnAnalysis(columns) {
            const container = document.getElementById('columnGrid');
            const analysisSection = document.getElementById('columnAnalysis');
            
            container.innerHTML = columns.map(column => `
                <div class="column-card ${column.type}-column">
                    <div class="column-name">${column.name}</div>
                    <div class="column-type type-${column.type}">
                        ${column.type === 'device' ? '设备列' : column.type === 'time' ? '时间列' : '业务列'}
                    </div>
                    <div class="column-description">${column.description}</div>
                </div>
            `).join('');
            
            analysisSection.style.display = 'block';
        }

        // 显示业务含义
        function showBusinessMeaning(meaning) {
            const container = document.getElementById('meaningText');
            const section = document.getElementById('businessMeaning');
            
            container.textContent = meaning;
            section.style.display = 'block';
        }

        // 显示控制原理
        function showControlPrinciple(principle) {
            const container = document.getElementById('principleText');
            const section = document.getElementById('controlPrinciple');
            
            container.textContent = principle;
            section.style.display = 'block';
        }

        // 显示数据摘要
        function showDataSummary(summary) {
            const container = document.getElementById('summaryGrid');
            const section = document.getElementById('dataSummary');
            
            container.innerHTML = `
                <div class="summary-card">
                    <div class="summary-value">${summary.totalRows.toLocaleString()}</div>
                    <div class="summary-label">总行数</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">${summary.totalColumns}</div>
                    <div class="summary-label">总列数</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">${summary.fileSize}</div>
                    <div class="summary-label">文件大小</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">${summary.deviceCount}</div>
                    <div class="summary-label">设备数量</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">${summary.dataQuality}%</div>
                    <div class="summary-label">数据质量</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">${summary.timeRange}</div>
                    <div class="summary-label">时间范围</div>
                </div>
            `;
            
            section.style.display = 'block';
        }

        // 显示分析结果
        function showAnalysisResults(businessAnalysis, qualityAssessment) {
            const businessContainer = document.getElementById('businessAnalysisContent');
            const qualityContainer = document.getElementById('qualityAnalysisContent');
            const scoreCircle = document.getElementById('scoreCircle');
            const scoreText = document.getElementById('scoreText');
            const section = document.getElementById('analysisResults');
            
            businessContainer.textContent = businessAnalysis;
            qualityContainer.textContent = qualityAssessment.details;
            
            // 设置质量评分圆环
            const score = qualityAssessment.score;
            const scoreDeg = (score / 100) * 360;
            scoreCircle.style.setProperty('--score-deg', `${scoreDeg}deg`);
            scoreText.textContent = `${score}%`;
            
            // 根据分数设置颜色
            if (score >= 90) {
                scoreCircle.style.background = `conic-gradient(#28a745 0deg, #28a745 ${scoreDeg}deg, #e9ecef ${scoreDeg}deg, #e9ecef 360deg)`;
            } else if (score >= 70) {
                scoreCircle.style.background = `conic-gradient(#ffc107 0deg, #ffc107 ${scoreDeg}deg, #e9ecef ${scoreDeg}deg, #e9ecef 360deg)`;
            } else {
                scoreCircle.style.background = `conic-gradient(#dc3545 0deg, #dc3545 ${scoreDeg}deg, #e9ecef ${scoreDeg}deg, #e9ecef 360deg)`;
            }
            
            section.style.display = 'grid';
        }

        // 加载数据集列表
        async function loadDatasets() {
            try {
                const response = await fetch(`${API_BASE}/datasets`);
                const datasets = await response.json();

                if (response.ok) {
                    allDatasets = datasets;
                    totalDatasets = datasets.length;
                    renderDatasetsWithPagination();
                } else {
                    showMessage('加载数据集列表失败', 'error');
                }
            } catch (error) {
                showMessage(`加载失败: ${error.message}`, 'error');
            }
        }

        // 渲染带分页的数据集列表
        function renderDatasetsWithPagination() {
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;
            const currentPageDatasets = allDatasets.slice(startIndex, endIndex);
            
            renderDatasets(currentPageDatasets);
            updatePagination();
        }

        // 更新分页控件
        function updatePagination() {
            const totalPages = Math.ceil(totalDatasets / pageSize);
            const pagination = document.getElementById('pagination');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageNumbers = document.getElementById('pageNumbers');
            const paginationInfo = document.getElementById('paginationInfo');

            // 显示或隐藏分页控件
            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            } else {
                pagination.style.display = 'flex';
            }

            // 更新上一页/下一页按钮状态
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;

            // 生成页码按钮
            pageNumbers.innerHTML = '';
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `pagination-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.onclick = () => goToPage(i);
                pageNumbers.appendChild(pageBtn);
            }

            // 更新分页信息
            const startItem = (currentPage - 1) * pageSize + 1;
            const endItem = Math.min(currentPage * pageSize, totalDatasets);
            paginationInfo.textContent = `显示 ${startItem}-${endItem} 条，共 ${totalDatasets} 条`;
        }

        // 跳转到指定页
        function goToPage(page) {
            currentPage = page;
            renderDatasetsWithPagination();
        }

        // 上一页/下一页
        function changePage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                currentPage--;
            } else if (direction === 'next') {
                const totalPages = Math.ceil(totalDatasets / pageSize);
                if (currentPage < totalPages) {
                    currentPage++;
                }
            }
            renderDatasetsWithPagination();
        }

        // 改变每页显示数量
        function changePageSize() {
            const select = document.getElementById('pageSizeSelect');
            pageSize = parseInt(select.value);
            currentPage = 1; // 重置到第一页
            renderDatasetsWithPagination();
        }

        // 渲染数据集列表
        function renderDatasets(datasets) {
            const container = document.getElementById('datasetsList');
            
            if (datasets.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">暂无数据集，请上传第一个数据集</p>';
                return;
            }

            // 添加列表头部
            const headerHtml = `
                <div class="datasets-header">
                    <div class="header-main-info">
                        <div class="header-name-section">数据集名称</div>
                        <div class="header-stats">
                            <div class="header-stat-item">文件大小</div>
                            <div class="header-stat-item">列数</div>
                            <div class="header-stat-item">质量评估</div>
                            <div class="header-stat-item">业务理解</div>
                        </div>
                    </div>
                    <div class="header-actions">操作</div>
                </div>
            `;

            const datasetsHtml = datasets.map(dataset => `
                <div class="dataset-card">
                    <div class="dataset-main-info">
                        <div class="dataset-name-section">
                        <div class="dataset-name">${dataset.name}</div>
                        <div class="dataset-upload-time">${formatDate(dataset.upload_time)}</div>
                            ${dataset.description ? `<div class="dataset-description" title="${dataset.description}">${dataset.description}</div>` : ''}
                            ${dataset.tags && dataset.tags.length > 0 ? `
                                <div class="dataset-tags">
                                    ${dataset.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                            ` : ''}
                        </div>
                        <div class="dataset-stats">
                            <div class="stat-item">
                                <div class="stat-value">${formatFileSize(dataset.file_size)}</div>
                                <div class="stat-label">文件大小</div>
                        </div>
                            <div class="stat-item">
                                <div class="stat-value">${dataset.columns ? dataset.columns.length : '未分析'}</div>
                                <div class="stat-label">列数</div>
                        </div>
                            <div class="stat-item">
                                <div class="stat-status">${getQualityStatus(dataset)}</div>
                                <div class="stat-label">质量评估</div>
                    </div>
                            <div class="stat-item">
                                <div class="stat-status">${getBusinessStatus(dataset)}</div>
                                <div class="stat-label">业务理解</div>
                        </div>
                        </div>
                    </div>
                    <div class="dataset-actions">
                        <div class="action-group function-group">
                            <button class="action-btn btn-primary" onclick="previewDataset('${dataset.id}')">数据预览</button>
                            ${dataset.processing_status === 'metadata_extracted' ? `<button class="action-btn btn-info" onclick="viewQualityReport('${dataset.id}')">质量报告</button>` : ''}
                            ${dataset.processing_status === 'metadata_extracted' ? `<button class="action-btn btn-info" onclick="viewBusinessAnalysis('${dataset.id}')">业务分析</button>` : ''}
                            ${dataset.processing_status === 'uploaded' ? `<button class="action-btn btn-primary" onclick="extractMetadata('${dataset.id}')">开始分析</button>` : ''}
                        </div>
                        <div class="action-group manage-group">
                            <button class="action-btn btn-success" onclick="downloadDataset('${dataset.id}')">下载</button>
                        <button class="action-btn btn-danger" onclick="deleteDataset('${dataset.id}')">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = headerHtml + datasetsHtml;
        }

        // 获取状态样式类
        function getStatusClass(status) {
            const statusMap = {
                'uploaded': 'uploaded',
                'extracting_metadata': 'extracting',
                'metadata_extracted': 'completed',
                'extraction_failed': 'failed'
            };
            return statusMap[status] || 'uploaded';
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'uploaded': '已上传',
                'extracting_metadata': '分析中',
                'metadata_extracted': '已完成',
                'extraction_failed': '分析失败'
            };
            return statusMap[status] || '未知状态';
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 1) {
                return '今天';
            } else if (diffDays === 2) {
                return '昨天';
            } else if (diffDays <= 7) {
                return `${diffDays-1}天前`;
            } else {
                return date.toLocaleDateString('zh-CN', {
                    month: '2-digit',
                    day: '2-digit'
                });
            }
        }

        function getQualityStatus(dataset) {

                const score = Math.round(dataset.quality_metrics.quality_score) || 100;
                return `<span class="quality-score">${score}分</span>`;

        // 下载数据集
        async function downloadDataset(datasetId) {
            try {
                showLoading(true);
                showMessage('正在准备下载...', 'info');

                const response = await fetch(`${API_BASE}/datasets/${datasetId}/download`);

                if (response.ok) {
                    // 获取文件名
                    const contentDisposition = response.headers.get('Content-Disposition');
                    let filename = 'dataset.csv';
                    if (contentDisposition) {
                        const filenameMatch = contentDisposition.match(/filename="(.+)"/);
                        if (filenameMatch) {
                            filename = filenameMatch[1];
                        }
                    }

                    // 创建下载链接
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);

                    showMessage('下载成功', 'success');
                } else {
                    const result = await response.json();
                    showMessage(`下载失败: ${result.detail}`, 'error');
                }
            } catch (error) {
                showMessage(`下载失败: ${error.message}`, 'error');
            } finally {
                showLoading(false);
            }
        }

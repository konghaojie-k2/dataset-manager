<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据管理系统</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/tags.css">
</head>
<body>
    <div class="container">
        <!-- 页面头部 -->
        <header class="header">
            <div class="header-content">
                <div class="header-text">
                    <h1>数据管理系统</h1>
                    <p>智能数据分析与管理平台</p>
                </div>
                <div class="header-actions">
                    <!-- 标签管理功能已集成到标签选择器中 -->
                </div>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main class="main-content">
            <!-- 文件上传区域 -->
            <section class="upload-section" id="uploadSection">
                <div class="upload-icon">📁</div>
                <h3>上传数据文件</h3>
                <p>支持CSV、ZIP格式文件，拖拽文件到此处或点击选择文件</p>
                <input type="file" id="fileInput" class="file-input" accept=".csv,.zip">
                <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    选择文件
                </button>
                <div class="upload-tips">
                    <p>💡 提示：请上传包含时间序列数据的文件，系统将自动进行智能分析</p>
            </div>
            </section>





            <!-- 数据集管理区域 -->
            <section class="datasets-section" id="datasetsTab">
                <h2 class="section-title">📚 数据集管理</h2>
                
                <!-- 每页显示数量选择器 -->
                <div class="page-size-selector">
                    <span>每页显示：</span>
                    <select id="pageSizeSelect" class="page-size-select" onchange="changePageSize()">
                        <option value="5">5条</option>
                        <option value="10" selected>10条</option>
                        <option value="20">20条</option>
                        <option value="50">50条</option>
                    </select>
                </div>
                
                <div id="datasetsList">
                    <!-- 动态生成数据集列表 -->
                </div>
                
                <!-- 翻页控件 -->
                <div class="pagination" id="pagination" style="display: none;">
                    <button class="pagination-btn" id="prevBtn" onclick="changePage('prev')" disabled>上一页</button>
                    <div id="pageNumbers"></div>
                    <button class="pagination-btn" id="nextBtn" onclick="changePage('next')">下一页</button>
                    <div class="pagination-info" id="paginationInfo"></div>
                </div>
            </section>


        </main>
    </div>

    <!-- 加载动画 -->
    <div class="loading" id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <div>正在处理，请稍候...</div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div class="message" id="message"></div>

    <!-- JavaScript 文件引用 -->
    <script src="assets/js/config.js?v=20250604"></script>
    <script src="assets/js/utils.js?v=20250604"></script>
    <script src="assets/js/api.js?v=20250604"></script>
    <script src="assets/js/markdown.js?v=20250604-3"></script>
    <script src="assets/js/upload.js?v=20250604"></script>
    <script src="assets/js/analysis.js?v=20250604-2"></script>
    <script src="assets/js/datasets.js?v=20250604"></script>
    <script src="assets/js/pagination.js?v=20250604"></script>
    <script src="assets/js/reports.js?v=20250604"></script>
    <script src="assets/js/quality.js?v=20250604"></script>
    <script src="assets/js/tags.js?v=20250604"></script>
    <script src="assets/js/main.js?v=20250604"></script>
</body>
</html>

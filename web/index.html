<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据管理系统</title>
    <link rel="stylesheet" href="static/assets/css/main.css">
    <link rel="stylesheet" href="static/assets/css/components.css">
    <link rel="stylesheet" href="static/assets/css/responsive.css">
</head>
<body>
    <div class="container">
        <!-- 页面头部 -->
        <header class="header">
            <h1>数据管理系统</h1>
            <p>智能数据分析与管理平台</p>
        </header>

        <!-- 主要内容区域 -->
        <main class="main-content">
            <!-- 文件上传区域 -->
            <section class="upload-section" id="uploadSection">
                <div class="upload-icon">📁</div>
                <h3>上传数据文件</h3>
                <p>支持CSV、ZIP格式文件，拖拽文件到此处或点击选择文件</p>
                <input type="file" id="fileInput" class="file-input" accept=".csv,.zip">
                <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    选择文件
                </button>
                <div class="upload-tips">
                    <p>💡 提示：请上传包含时间序列数据的文件，系统将自动进行智能分析</p>
            </div>
            </section>

            <!-- LangGraph流程展示 -->
            <section class="langgraph-flow" id="langGraphFlow" style="display: none;">
                <div class="flow-title">🚀 数据处理流程</div>
                <div class="flow-steps">
                    <div class="flow-step" id="step-upload">
                        <span class="step-icon">📤</span>
                        <div class="step-title">数据上传</div>
                        <div class="step-description">文件上传与基础信息提取</div>
                    </div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-step" id="step-business">
                        <span class="step-icon">💡</span>
                        <div class="step-title">业务分析</div>
                        <div class="step-description">设备列识别、业务语义分析、控制逻辑推理</div>
                    </div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-step" id="step-quality">
                        <span class="step-icon">✅</span>
                        <div class="step-title">数据质量分析</div>
                        <div class="step-description">数据质量评估与分析</div>
                    </div>
                </div>
            </section>

            <!-- 数据集管理区域 -->
            <section class="datasets-section">
                <h2 class="section-title">📚 数据集管理</h2>
                
                <!-- 每页显示数量选择器 -->
                <div class="page-size-selector">
                    <span>每页显示：</span>
                    <select id="pageSizeSelect" class="page-size-select" onchange="changePageSize()">
                        <option value="5">5条</option>
                        <option value="10" selected>10条</option>
                        <option value="20">20条</option>
                        <option value="50">50条</option>
                    </select>
                </div>
                
                <div id="datasetsList">
                    <!-- 动态生成数据集列表 -->
                </div>
                
                <!-- 翻页控件 -->
                <div class="pagination" id="pagination" style="display: none;">
                    <button class="pagination-btn" id="prevBtn" onclick="changePage('prev')" disabled>上一页</button>
                    <div id="pageNumbers"></div>
                    <button class="pagination-btn" id="nextBtn" onclick="changePage('next')">下一页</button>
                    <div class="pagination-info" id="paginationInfo"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- 加载动画 -->
    <div class="loading" id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <div>正在处理，请稍候...</div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div class="message" id="message"></div>

    <!-- JavaScript 文件引用 -->
    <script src="static/assets/js/config.js"></script>
    <script src="static/assets/js/utils.js"></script>
    <script src="static/assets/js/api.js"></script>
    <script src="static/assets/js/upload.js"></script>
    <script src="static/assets/js/analysis.js"></script>
    <script src="static/assets/js/datasets.js"></script>
    <script src="static/assets/js/pagination.js"></script>
    <script src="static/assets/js/reports.js"></script>
    <script src="static/assets/js/main.js"></script>
</body>
</html>

[project]
name = "dataset-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "dotenv>=0.9.9",
    "fastapi>=0.115.12",
    "json-repair>=0.46.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "pandas>=2.2.3",
    "pathlib>=1.0.1",
    "playwright>=1.53.0",
    "pytest-playwright>=0.7.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "seaborn>=0.13.2",
    "supabase>=2.0.0",
    "httpx>=0.25.0",
    "uvicorn>=0.34.2",
    "langgraph-cli[inmem]>=0.4.11",
    "aiosqlite>=0.22.1",
]
[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.anyio]
asyncio_mode = "asyncio"
